# XcodeGen spec — run `xcodegen generate` in this folder to produce Upscroll.xcodeproj.
name: Upscroll
options:
  bundleIdPrefix: com.upscroll
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Upscroll:
    type: application
    platform: iOS
    # Secrets.xcconfig (git-ignored) holds DS_APP_SECRET, the request-signing secret shared with the server.
    configFiles:
      Debug: Secrets.xcconfig
      Release: Secrets.xcconfig
    sources:
      - path: Upscroll
    info:
      path: Upscroll/Info.plist
      properties:
        CFBundleDisplayName: Upscroll
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        # Deep link back from the sign-in email: upscroll://auth-callback
        CFBundleURLTypes:
          - CFBundleURLName: com.upscroll.app.auth
            CFBundleURLSchemes: [upscroll]
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
        NSSpeechRecognitionUsageDescription: Upscroll listens when you tap the mic to check you said the phrase. It runs on your iPhone when possible.
        NSMicrophoneUsageDescription: The mic is used only while you practise saying a phrase.
        # Lesson server (TypeSafe Jev word picks). Override per build with LESSON_SERVER_URL.
        LessonServerURL: $(LESSON_SERVER_URL)
        DSAppSecret: $(DS_APP_SECRET)
        # Supabase cloud save: bare host (xcconfig can't hold "//") and the anon/publishable key, from Secrets.xcconfig.
        SupabaseHost: $(SUPABASE_HOST)
        SupabaseAnonKey: $(SUPABASE_ANON_KEY)
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.education
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.upscroll.app
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: false
        # Deployed lesson server (Vercel, TypeSafe key set there). For local dev: "http://localhost:8787".
        LESSON_SERVER_URL: "https://upscroll-lesson.vercel.app"

  UpscrollUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UpscrollUITests
    dependencies:
      - target: Upscroll
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        TEST_TARGET_NAME: Upscroll
schemes:
  Upscroll:
    build:
      targets:
        Upscroll: all
        UpscrollUITests: [test]
    test:
      targets: [UpscrollUITests]
